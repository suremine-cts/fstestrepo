apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: flowsource-sdlc
  appid: @'flowsource-sdlc'
  description: flowsource sdlc support
  annotations:
    backstage.io/techdocs-ref: dir:.
    # For GitHub plugin
    flowsource/github-repo-owner: <github-repo-owner>
    flowsource/github-repo-name: <github-repo-name>
    # For JIRA plugin
    flowsource/jira-project-key: <jira-project-key>
    flowsource/durationInDays: "<duration-in-days>"
    # For Jenkins plugin
    flowsource/jenkins-pipelines: <jenkins-pipeline-path>
    # For DORA
    flowsource/dora-cicd-tool: <cicd-tool>
    flowsource/dora-scm-tool: <scm-tool>
    flowsource/dora-alm-tool: <alm-tool>
    # flowsource/dora-itsm-tool: <itsm-tool>
    # flowsource/dora-observability-platform: <observability-platform>
    flowsource/dora-jira-final-status: <jira-final-status>
    flowsource/jenkins-prod-deployment-job-full-project-name: <jenkins-prod-deployment-job-full-project-name>
    # For CodeQuality Plugin
    flowsource/sonarqube-project-key: <sonarqube-project-key>
    flowsource/servicenow-configuration-item: <servicenow-configuration-item>
    flowsource/veracode-app-name: <veracode-app-name>
    flowsource/dynatrace-clusterName: <dynatrace-cluster-name>
    flowsource/dynatrace-deploymentName: <dynatrace-deployment-name>
spec:
  type: website # website or service
  lifecycle: experimental
  owner: group:admin
  providesApis:
    - <component-name>-apis
  ##consumesApis:
   # - <your component name>
   # - <your component name>
# dependsOn:
  #  - component:default/<Name of component which has dependency>
  #subcomponentOf: component:default/<Name of the parent component>


---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: <component-name>-apis
  description: <description>
spec:
  type: openapi
  lifecycle: <lifecycle>
  system: default/<component-name>
  owner: group:<owner-group>
  definition:
    $text: <path-to-swagger-file> #Path of the swagger file
